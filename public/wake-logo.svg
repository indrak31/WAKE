<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,450&amp;display=swap');
      .wordmark {
        font-family: 'Fraunces', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
        font-style: italic;
        font-weight: 450;
        font-size: 96px;
        letter-spacing: -1.5px;
        fill: #F4EFE6;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="620" height="200" fill="#1B1626"/>

  <!-- wake mark: a moment (dot) trailing three fading ripples -->
  <g>
    <path d="M 124.41 109 Q 116.06 100 124.41 91" fill="none" stroke="#E7A94C" stroke-width="4.5" stroke-linecap="round" opacity="1"/>
    <path d="M 112.29 116 Q 97.44 100 112.29 84" fill="none" stroke="#E7A94C" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M 100.16 123 Q 78.82 100 100.16 77" fill="none" stroke="#E7A94C" stroke-width="3.5" stroke-linecap="round" opacity="0.28"/>
    <circle cx="140" cy="100" r="9" fill="#E7A94C"/>
  </g>

  <text x="200" y="138" class="wordmark">wake</text>
</svg>
